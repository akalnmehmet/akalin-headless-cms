<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="M. Akalın" />
    <title>Mehmet Akalın — Portföy</title>
    <meta name="description" content="Mehmet Akalın'ın kişisel portföy ve blogu. Yazılım geliştirme, robotik, derin öğrenme ve sistem tasarımı üzerine projeler ve yazılar." />
    <meta name="author" content="Mehmet Akalın" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0e17" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Mehmet Akalın" />
    <meta property="og:title"       content="Mehmet Akalın — Portföy" />
    <meta property="og:description" content="Yazılım geliştirme, robotik, derin öğrenme ve sistem tasarımı üzerine projeler ve yazılar." />
    <meta property="og:url"         content="https://akalin-cms.vercel.app" />
    <meta property="og:image"       content="https://akalin-cms.vercel.app/og-image.png" />
    <meta property="og:locale"      content="tr_TR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Mehmet Akalın — Portföy" />
    <meta name="twitter:description" content="Yazılım geliştirme, robotik ve derin öğrenme üzerine projeler ve yazılar." />
    <meta name="twitter:image"       content="https://akalin-cms.vercel.app/og-image.png" />

    <!-- RSS Auto-discovery -->
    <link rel="alternate" type="application/rss+xml" title="Mehmet Akalın — Blog" href="/feed.xml" />
    <!-- Canonical -->
    <link rel="canonical" href="https://akalin-cms.vercel.app" />

    <!-- DNS/TLS bağlantısını erkenden kur -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Kritik font CSS'ini yüksek öncelikle önceden yükle -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&display=swap" />

    <!-- Tam font yüklemeleri -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;600;700&display=swap"
          rel="stylesheet" fetchpriority="high" />
    <!-- İkon fontu — render-blocking değil, sonradan yüklenebilir -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Critical CSS: FOUC'u önle, ilk boyamayı hızlandır -->
    <style>
      *,::before,::after{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;
        background:#0a0d14;
        color:#e2e8f0;
        font-family:'Syne',system-ui,sans-serif;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }
      #root{min-height:100vh}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
