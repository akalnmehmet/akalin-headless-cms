<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="80" y="72" width="120" height="3" rx="2" fill="url(#accent)"/>

  <!-- Code comment prefix -->
  <text x="80" y="200" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="22" font-weight="400" fill="#00d4ff" opacity="0.8">
    // portföy
  </text>

  <!-- Main name -->
  <text x="80" y="290" font-family="'Syne', 'Arial', sans-serif"
        font-size="88" font-weight="800" letter-spacing="-3"
        fill="#ffffff">
    Mehmet Akalın
  </text>

  <!-- Subtitle -->
  <text x="82" y="360" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="26" font-weight="400" fill="#00d4ff">
    Yazılım Mühendisi · Robotik · Derin Öğrenme
  </text>

  <!-- Bottom tag row -->
  <!-- Tag 1 -->
  <rect x="80" y="430" width="110" height="38" rx="8" fill="#ffffff0d" stroke="#ffffff15" stroke-width="1"/>
  <text x="135" y="454" font-family="'JetBrains Mono', monospace" font-size="16"
        fill="#a0aec0" text-anchor="middle">Python</text>

  <!-- Tag 2 -->
  <rect x="204" y="430" width="110" height="38" rx="8" fill="#ffffff0d" stroke="#ffffff15" stroke-width="1"/>
  <text x="259" y="454" font-family="'JetBrains Mono', monospace" font-size="16"
        fill="#a0aec0" text-anchor="middle">Django</text>

  <!-- Tag 3 -->
  <rect x="328" y="430" width="110" height="38" rx="8" fill="#ffffff0d" stroke="#ffffff15" stroke-width="1"/>
  <text x="383" y="454" font-family="'JetBrains Mono', monospace" font-size="16"
        fill="#a0aec0" text-anchor="middle">React</text>

  <!-- Tag 4 -->
  <rect x="452" y="430" width="110" height="38" rx="8" fill="#ffffff0d" stroke="#ffffff15" stroke-width="1"/>
  <text x="507" y="454" font-family="'JetBrains Mono', monospace" font-size="16"
        fill="#a0aec0" text-anchor="middle">ROS2</text>

  <!-- Tag 5 -->
  <rect x="576" y="430" width="160" height="38" rx="8" fill="#ffffff0d" stroke="#ffffff15" stroke-width="1"/>
  <text x="656" y="454" font-family="'JetBrains Mono', monospace" font-size="16"
        fill="#a0aec0" text-anchor="middle">TypeScript</text>

  <!-- Right glow orb -->
  <circle cx="1050" cy="315" r="220" fill="#00d4ff" opacity="0.04"/>
  <circle cx="1050" cy="315" r="140" fill="#7c3aed" opacity="0.06"/>

  <!-- Domain -->
  <text x="1120" y="560" font-family="'JetBrains Mono', monospace" font-size="18"
        fill="#ffffff30" text-anchor="end">akalin-cms.vercel.app</text>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)" opacity="0.6"/>
</svg>
