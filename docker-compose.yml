services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolyo_db
      POSTGRES_USER: portfolyo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolyo_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - media_files:/app/media

  celery_worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - db
      - redis
    volumes:
      - media_files:/app/media

  celery_beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        # Üretimde backend'in public URL'i buraya girilmeli (örn: https://api.example.com)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_files:


