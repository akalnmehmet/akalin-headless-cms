services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolyo_db
      POSTGRES_USER: portfolyo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolyo_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - media_files:/app/media

volumes:
  postgres_data:
  media_files:
